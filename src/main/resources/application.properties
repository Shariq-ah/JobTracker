spring.application.name=jobtracker
logging.level.root=INFO
logging.level.com.jobtracker=DEBUG
spring.devtools.restart.enabled=false
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/jobtracker}
spring.mongodb.database=jobtracker

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}

candidate.skills=Java,Spring Boot,Spring MVC,Spring Framework,Microservices,REST API,Kafka,JPA,Hibernate,SQL,NoSQL,Git,Docker,Maven,JUnit,Agile,AWS
candidate.experience=3.6
candidate.roles=Software Engineer,Backend Engineer,Java Developer,Software Development Engineer

aws.bedrock.region=${AWS_BEDROCK_REGION:us-east-1}
aws.bedrock.access.key=${AWS_ACCESS_KEY_ID:dummy-access-key}
aws.bedrock.secret.key=${AWS_SECRET_ACCESS_KEY:dummy-secret-key}
aws.bedrock.model.id=${AWS_BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
aws.bedrock.max.tokens=${AWS_BEDROCK_MAX_TOKENS:3000}
aws.bedrock.timeout.seconds=${AWS_BEDROCK_TIMEOUT_SECONDS:30}
aws.bedrock.temperature=${AWS_BEDROCK_TEMPERATURE:0.0}

ai.bedrock.enabled=${AI_BEDROCK_ENABLED:true}
ai.bedrock.min-local-score=${AI_BEDROCK_MIN_LOCAL_SCORE:20}
