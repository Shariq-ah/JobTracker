spring.application.name=jobtracker
logging.level.root=INFO
logging.level.com.jobtracker=INFO
spring.mongodb.uri=mongodb://localhost:27017/jobtracker
spring.mongodb.database=jobtracker
spring.devtools.restart.enabled=false

# Telegram Configuration (use environment variables for security)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.chat.id=${TELEGRAM_CHAT_ID:}

