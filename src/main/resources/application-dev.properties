# AWS Bedrock Configuration (use environment variables for security)
aws.bedrock.region=${AWS_BEDROCK_REGION:us-east-1}
aws.bedrock.access.key=${AWS_ACCESS_KEY_ID:}
aws.bedrock.secret.key=${AWS_SECRET_ACCESS_KEY:}
aws.bedrock.model.id=${AWS_BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
aws.bedrock.max.tokens=${AWS_BEDROCK_MAX_TOKENS:8000}
aws.bedrock.timeout.seconds=${AWS_BEDROCK_TIMEOUT_SECONDS:60}
aws.bedrock.temperature=${AWS_BEDROCK_TEMPERATURE:0.0}

# AI cost controls
ai.bedrock.enabled=${AI_BEDROCK_ENABLED:true}
ai.bedrock.min-local-score=${AI_BEDROCK_MIN_LOCAL_SCORE:20}

# Development Mode - ZERO COST TESTING
# When true: Uses mock responses instead of calling Claude API (FREE)
# When false: Makes real API calls (costs ~$0.001 per job)
# RECOMMENDED: Set to 'true' for local testing to save money
ai.dev.mock.enabled=${AI_DEV_MOCK_ENABLED:true}

# Phase 3: Resume Tailoring
# Local LaTeX compilation (faster and more reliable)
latex.local.enabled=${LATEX_LOCAL_ENABLED:true}
latex.temp.dir=${LATEX_TEMP_DIR:/tmp/jobtracker/latex}

# Online API fallback (used if local pdflatex not available)
latex.online.api.url=${LATEX_ONLINE_API_URL:https://ytotech.com}
latex.compilation.timeout.seconds=${LATEX_COMPILATION_TIMEOUT:30}

resume.tailoring.enabled=${RESUME_TAILORING_ENABLED:true}
resume.tailoring.min-score=${RESUME_TAILORING_MIN_SCORE:70}

# General Resume (Option 1: Place in src/main/resources/resume/general_resume.pdf)
# General Resume (Option 2: Specify external path below)
# resume.general.pdf.path=/home/shaa/Documents/resume/Sharique_Ahmad_Resume.pdf


# Provider toggles (disable temporarily if rate limited)
provider.microsoft.enabled=${PROVIDER_MICROSOFT_ENABLED:true}
provider.amazon.enabled=${PROVIDER_AMAZON_ENABLED:true}
provider.amex.enabled=${PROVIDER_AMEX_ENABLED:true}
provider.jpmorgan.enabled=${PROVIDER_JPMORGAN_ENABLED:true}
provider.barclays.enabled=${PROVIDER_BARCLAYS_ENABLED:true}
provider.goldman.enabled=${PROVIDER_GOLDMAN_ENABLED:true}
provider.visa.enabled=${PROVIDER_VISA_ENABLED:true}
