spring.application.name=jobtracker
logging.level.root=INFO
logging.level.com.jobtracker=DEBUG
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
spring.mongodb.uri=${MONGO_URI}
spring.devtools.restart.enabled=false
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}
logging.level.org.springframework.data.mongodb=ERROR
candidate.skills=Java,Spring Boot,Spring MVC,Spring Framework,Microservices,REST API,Kafka,JPA,Hibernate,SQL,NoSQL,Git,Docker,Maven,JUnit,Agile,AWS
candidate.experience=3
candidate.roles=Software Engineer,Backend Engineer,Java Developer,Software Development Engineer,Java Full Stack Developer,Full Stack Developer,Software Developer,Software Development

# AWS Bedrock Configuration (from environment)
aws.bedrock.region=${AWS_BEDROCK_REGION:us-east-1}
aws.bedrock.access.key=${AWS_ACCESS_KEY_ID}
aws.bedrock.secret.key=${AWS_SECRET_ACCESS_KEY}
aws.bedrock.model.id=anthropic.claude-3-5-haiku-20241022-v1:0
aws.bedrock.max.tokens=${AWS_BEDROCK_MAX_TOKENS:800}
aws.bedrock.timeout.seconds=30
aws.bedrock.temperature=0.0

# AI cost controls
ai.bedrock.enabled=${AI_BEDROCK_ENABLED:true}
ai.bedrock.min-local-score=${AI_BEDROCK_MIN_LOCAL_SCORE:20}
