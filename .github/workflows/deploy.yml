name: Verify Render deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give execute permission
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw clean package -DskipTests

      - name: Wait for Render deployment
        id: render
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_HEALTH_URL}" ]; then
            echo "::error::RENDER_HEALTH_URL secret is not set. Add your Render /health URL in GitHub repo secrets."
            exit 1
          fi

          SHORT_SHA="${EXPECTED_SHA:0:7}"
          echo "Waiting for Render to deploy commit ${SHORT_SHA}..."

          # Give Render time to start the build before polling.
          sleep 90

          MAX_ATTEMPTS=60
          INTERVAL=20
          LAST_RESPONSE=""

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            RESPONSE=""
            if RESPONSE="$(curl -sf --max-time 15 "${RENDER_HEALTH_URL}" 2>/dev/null)"; then
              LAST_RESPONSE="${RESPONSE}"

              if echo "${RESPONSE}" | grep -q "Commit: ${SHORT_SHA}"; then
                echo "Render is serving commit ${SHORT_SHA}"
                echo "health_response=${RESPONSE}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi

              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: app is up but not on ${SHORT_SHA} yet"
              echo "Response: ${RESPONSE}"
            else
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: health check unavailable (deploy may still be in progress)"
            fi

            sleep "${INTERVAL}"
          done

          if [ -n "${LAST_RESPONSE}" ]; then
            echo "last_health_response=${LAST_RESPONSE}" >> "${GITHUB_OUTPUT}"
          fi

          echo "::error::Timed out waiting for Render to serve commit ${SHORT_SHA}"
          exit 1

      - name: Notify Telegram — deploy succeeded
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; skipping success notification"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          MESSAGE="✅ <b>JobTracker deployed successfully on Render</b>

          Commit: <code>${SHORT_SHA}</code>
          Branch: main
          By: ${{ github.actor }}
          <a href=\"${COMMIT_URL}\">View commit</a>"

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

      - name: Notify Telegram — deploy failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LAST_HEALTH_RESPONSE: ${{ steps.render.outputs.last_health_response }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; skipping failure notification"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"

          PROD_STATUS="Health check unavailable — app may be down during deploy."
          if [ -n "${LAST_HEALTH_RESPONSE}" ]; then
            PROD_COMMIT="$(echo "${LAST_HEALTH_RESPONSE}" | sed -n 's/.*Commit: \([^ |]*\).*/\1/p')"
            if [ -n "${PROD_COMMIT}" ] && [ "${PROD_COMMIT}" != "${SHORT_SHA}" ]; then
              PROD_STATUS="Prod is still serving the previous commit <code>${PROD_COMMIT}</code> (expected <code>${SHORT_SHA}</code>)."
            elif [ -n "${PROD_COMMIT}" ]; then
              PROD_STATUS="Health reported commit <code>${PROD_COMMIT}</code>, but verification timed out."
            else
              PROD_STATUS="Health responded, but no commit was reported yet."
            fi
          fi

          MESSAGE="❌ <b>JobTracker deployment failed</b>

          Expected commit: <code>${SHORT_SHA}</code>
          ${PROD_STATUS}
          Branch: main
          By: ${{ github.actor }}
          <a href=\"${COMMIT_URL}\">View commit</a>
          <a href=\"${RUN_URL}\">View workflow run</a>

          Check the Render dashboard and GitHub Actions logs for details."

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
