name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build success
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Give execute permission
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify